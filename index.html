<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140b10" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- fontes no próprio domínio (licenças em /fonts/LICENSE.md) -->

  <body>

    <div class="cena-luz" id="cena-luz" aria-hidden="true"></div>
