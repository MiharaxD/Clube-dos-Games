<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0b12;--card:#1a1a2e;--green:#39ff14;--pink:#ff2bd6;--ink:#ececf5;--muted:#a3a3bd}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--ink);font:15px/1.5 Inter,sans-serif}
.top{padding:16px;font:12px "Press Start 2P";color:var(--green);text-shadow:0 0 8px var(--green)}
h1{font:20px "Press Start 2P";padding:8px 16px;color:var(--pink);text-shadow:0 0 10px var(--pink)}
.bar{margin:12px 16px;height:14px;background:var(--card);border:2px solid var(--green);box-shadow:0 0 10px var(--green)}
.bar i{display:block;width:45%;height:100%;background:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:var(--card);border:2px solid var(--pink);box-shadow:0 0 12px #ff2bd655;padding:8px}
.cover{aspect-ratio:3/4}
.c1{background:linear-gradient(160deg,#2b6cb0,#1a2a5a 60%,#e94f37)}.c2{background:linear-gradient(170deg,#3a1f4f,#c0306e 70%,#ffcf5c)}
.card p{font:9px/1.6 "Press Start 2P";margin-top:8px}
.btn{margin-top:8px;width:100%;padding:8px;background:var(--green);border:0;font:9px "Press Start 2P"}
</style></head><body>
<div class="top">CLUBE DOS JOGOS</div>
<h1>FASE 7: VOTANDO</h1>
<div class="bar"><i></i></div>
<div class="grid">
 <div class="card"><div class="cover c1"></div><p>OUTER WILDS</p><button class="btn">VOTAR</button></div>
 <div class="card"><div class="cover c2"></div><p>HADES</p><button class="btn">ESSE É SEU</button></div>
</div>
</body></html>
