<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Barlow:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--ground:#1a1411;--shelf:#2e2420;--edge:#46362e;--paper:#f4ecd2;--orange:#ff7a1a;--lime:#b6f03c;--pink:#ff3d6e;--ink:#f6efe4;--muted:#c8b9a8}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--ink);font:16px/1.45 Barlow,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid var(--edge)}
.logo{font:36px/1 "Jersey 10";color:var(--orange)}
.top nav{font-weight:600;font-size:14px;color:var(--muted)}
.hero{padding:16px}
.hero h1{font:52px/.9 "Jersey 10"}
.hero p{color:var(--muted);font-size:14px}
.steps{display:flex;gap:6px;margin-top:12px}
.steps span{flex:1;text-align:center;font:600 12px Barlow;text-transform:uppercase;padding:6px 0;background:var(--shelf);border-radius:3px}
.steps .now{background:var(--lime);color:#1a1411}
.shelf{margin-top:8px;padding:16px 16px 0;background:var(--shelf);border-top:3px solid var(--edge)}
.shelf h2{font:28px "Jersey 10";color:var(--lime)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 0 18px;border-bottom:10px solid var(--edge)}
.box{position:relative}
.cover{aspect-ratio:3/4;width:100%;box-shadow:0 6px 0 #0006}
.c1{background:linear-gradient(160deg,#2b6cb0,#1a2a5a 60%,#e94f37)}.c2{background:linear-gradient(170deg,#3a1f4f,#c0306e 70%,#ffcf5c)}
.tag{position:absolute;top:-6px;right:-6px;background:var(--orange);color:#1a1411;font:18px "Permanent Marker";padding:2px 8px;transform:rotate(6deg)}
.lanc{position:absolute;left:-4px;bottom:46px;background:var(--pink);color:#1a1411;font:700 11px Barlow;padding:2px 6px}
.box h3{font:700 16px Barlow;margin-top:10px}
.box small{color:var(--muted)}
.ficha{margin:16px;background:var(--paper);color:#2a1d17;padding:12px 14px;transform:rotate(-1deg)}
.ficha b{font:24px "Jersey 10"}
.ficha p{font:18px "Permanent Marker"}
</style></head><body>
<header class="top"><span class="logo">CLUBE DOS JOGOS</span><nav>Estante · Stats</nav></header>
<section class="hero"><h1>FASE 7</h1><p>Votação aberta até domingo</p>
<div class="steps"><span>Sugerindo</span><span class="now">Votando</span><span>Jogando</span><span>Encerrada</span></div></section>
<section class="shelf"><h2>Lançamentos da rodada</h2>
<div class="row">
 <div class="box"><div class="cover c1"></div><span class="tag">R$ 60</span><span class="lanc">MÉDIO · SOLO</span><h3>Outer Wilds</h3><small>7 de 8 conseguem jogar</small></div>
 <div class="box"><div class="cover c2"></div><span class="tag">R$ 47</span><span class="lanc">MÉDIO · SOLO</span><h3>Hades</h3><small>esse é seu, calma</small></div>
</div></section>
<div class="ficha"><b>FICHA DE LOCAÇÃO</b><p>Devolver até 30/11</p></div>
</body></html>
